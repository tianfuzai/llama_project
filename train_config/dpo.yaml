# ============================================================
# DPO alignment training config (FR-D3)
# Build on SFT-LoRA output; dataset = shanxi_dpo (>=200 pairs).
# DPO holds both policy and reference models, needs more VRAM.
# ============================================================
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
adapter_name_or_path: ./saves/sft_exp1
flash_attn: disabled

dataset: shanxi_dpo
dataset_dir: data
template: qwen
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj

per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_train_epochs: 3
learning_rate: 2e-5
warmup_ratio: 0.05
lr_scheduler_type: cosine
max_grad_norm: 1.0
logging_steps: 10
save_steps: 100
eval_strategy: steps
eval_steps: 100
val_size: 0.1
output_dir: ./saves/dpo
overwrite_output_dir: true

pref_beta: 0.1
pref_loss: sigmoid

fp16: true
bf16: false
cutoff_len: 1024
preprocessing_num_workers: 1

gradient_checkpointing: true
optim: adamw_torch
use_cache: false
seed: 42
