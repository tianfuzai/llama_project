# ============================================================
# SFT Exp2 - Larger rank
# LoRA rank=16, alpha=32, lr=2e-5
# Compare effect of larger rank on fitting / overfitting
# ============================================================
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
flash_attn: disabled

dataset: shanxi_sft
dataset_dir: data
template: qwen
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj

per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_train_epochs: 3
learning_rate: 2e-5
warmup_ratio: 0.05
lr_scheduler_type: cosine
max_grad_norm: 1.0
logging_steps: 10
save_steps: 100
output_dir: ./saves/sft_exp2
overwrite_output_dir: true

fp16: true
bf16: false
cutoff_len: 1024
preprocessing_num_workers: 1

gradient_checkpointing: true
optim: adamw_torch
use_cache: false
seed: 42
