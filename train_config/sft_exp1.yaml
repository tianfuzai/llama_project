# ============================================================
# SFT Exp1 - Minimum viable config for demo
# ============================================================
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
flash_attn: disabled

dataset: shanxi_sft
dataset_dir: data
template: qwen
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_target: q_proj,v_proj

per_device_train_batch_size: 1
gradient_accumulation_steps: 1
num_train_epochs: 1
learning_rate: 2e-4
warmup_ratio: 0.0
lr_scheduler_type: cosine
max_grad_norm: 1.0
logging_steps: 1
save_steps: 50
output_dir: ./saves/sft_exp1
overwrite_output_dir: true

fp16: true
bf16: false
cutoff_len: 256
preprocessing_num_workers: 1

gradient_checkpointing: true
optim: adamw_torch
use_cache: false
seed: 42
