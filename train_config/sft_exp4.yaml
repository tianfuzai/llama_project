# ============================================================
# SFT Exp4 - Larger learning rate
# LoRA rank=8, alpha=16, lr=1e-4
# Compare effect of larger lr on loss oscillation / convergence
# ============================================================
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
flash_attn: disabled

dataset: shanxi_sft
dataset_dir: data
template: qwen
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj

per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_train_epochs: 3
learning_rate: 1e-4
warmup_ratio: 0.05
lr_scheduler_type: cosine
max_grad_norm: 1.0
logging_steps: 10
save_steps: 100
output_dir: ./saves/sft_exp4
overwrite_output_dir: true

fp16: true
bf16: false
cutoff_len: 1024
preprocessing_num_workers: 1

gradient_checkpointing: true
optim: adamw_torch
use_cache: false
seed: 42
